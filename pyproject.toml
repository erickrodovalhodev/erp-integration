[project]
name = "erp-integration"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "httpx>=0.27", "pydantic-settings>=2.4",
  "tenacity>=9.0", "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.30", "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "aiosqlite"]

[tool.setuptools.packages.find]
include = ["app*"]
